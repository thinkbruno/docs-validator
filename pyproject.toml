[project]
name = "docs-validator"
version = "1.0.0"
description = "Documents validator (CNPJ numeric and alphanumeric)"
authors = [{ name = "Bruno Ramos" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "typer[all]"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
docs-validator = "docs_validator.cli:app"